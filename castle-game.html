  }
  const cloudGoal = wxState === 'clear' ? 0 : (wxState === 'cloud' ? 0.6 : 0.9);
  const rainGoal = wxState === 'rain' ? 1 : 0;
  cloudF += (cloudGoal - cloudF) * Math.min(1, dt * 0.25);
  rainF += (rainGoal - rainF) * Math.min(1, dt * 0.25);
  rain.material.opacity = rainF * 0.75;
  rain.visible = rainF > 0.03;
  if (rain.visible) {
    const p = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN_N; i++) {
      p[i * 3 + 1] -= 58 * dt;
      p[i * 3] += 6 * dt;
      if (p[i * 3 + 1] < 0) { p[i * 3 + 1] = 55 + Math.random() * 5; p[i * 3] = (Math.random() - 0.5) * 190; p[i * 3 + 2] = (Math.random() - 0.5) * 140; }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  skyHudT -= dt;
  if (skyHudT <= 0) {
    skyHudT = 0.5;
    const phase = elev <= 0 ? '夜' : (dayF > 0.55 ? '昼' : (Math.cos(th) > 0 ? '朝' : '夕'));
    const wxName = wxState === 'clear' ? '晴れ' : (wxState === 'cloud' ? '曇り' : '雨');
    document.getElementById('sky').textContent = phase + '・' + wxName;
  }
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- データと定数 ----------
const byKey = {};
for (const m of window.EXTRA_MODELS) byKey[m.key] = m;
const SIDES = {
  shu: { name: '蜀', color: 0x58b368, css: 'shu' },
  wei: { name: '魏', color: 0x5b8dd9, css: 'wei' },
  wu:  { name: '呉', color: 0xd95b5b, css: 'wu' },
};
const SOLDIER_TYPES = [
  { kind: 'hohei', w: 0.45, hp: 11, dmg: 1.15, range: 2.5, speed: 5.2 },
  { kind: 'yarihei', w: 0.25, hp: 12, dmg: 1.35, range: 2.9, speed: 5.0 },
  { kind: 'yumihei', w: 0.20, hp: 8, dmg: 0.95, range: 9.0, speed: 5.4 },
  { kind: 'kihei', w: 0.10, hp: 15, dmg: 1.7, range: 2.6, speed: 8.6 },
];
const GENERAL_KEYS = ['guanyu', 'zhangfei', 'zhugeliang', 'zhaoyun', 'lubu'];
const GENERAL_COST = 40;
const UNIT_CAP = 34;

// ---------- 拠点 ----------
const holds = [];
function barMesh(color, w) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.55, 0.55), new THREE.MeshBasicMaterial({ color }));
  scene.add(m);
  return m;
}
function makeHold(side, kind, x, z) {
  const entry = byKey[kind + '_' + side];
  const u = makeUnit(entry);
  const scale = kind === 'castle' ? 0.55 : 0.42;
  u.mesh.scale.setScalar(scale);
  u.mesh.rotation.y = Math.PI;
  u.mesh.position.set(x, 0, z);
  scene.add(u.mesh);
  const maxHp = kind === 'castle' ? 340 : 150;
  const h = { side, kind, x, z, hp: maxHp, maxHp, u, scale, spawnT: Math.random() * 2,
              bar: barMesh(SIDES[side].color, kind === 'castle' ? 15 : 9), barY: kind === 'castle' ? 24.5 : 14.5 };
  h.bar.position.set(x, h.barY, z);
  holds.push(h);
  return h;
}
// 城・砦はHPが減ると上の方からボクセルが消えて崩れていく（最低でも土台は残る）
function crumbleHold(h) {
  const surf = h.u.surfaces[0];
  if (h.orderU !== h.u) {
    h.orderU = h.u;
    h.order = surf.map((v, i) => i).sort((a, b) => surf[b][1] - surf[a][1]);
  }
  const n = surf.length;
  const keep = Math.floor(n * Math.max(0.12, h.hp / h.maxHp));
  for (let k = keep; k < n; k++) {
    _dummy.position.set(0, -500, 0);
    _dummy.rotation.set(0, 0, 0);
    _dummy.scale.setScalar(0.0001);
    _dummy.updateMatrix();
    h.u.mesh.setMatrixAt(h.order[k], _dummy.matrix);
  }
  h.u.mesh.instanceMatrix.needsUpdate = true;
}
function setHoldSide(h, side) {
  scene.remove(h.u.mesh);
  h.side = side;
  const entry = byKey[h.kind + '_' + side];
  h.u = makeUnit(entry);
  h.u.mesh.scale.setScalar(h.scale);
  h.u.mesh.rotation.y = Math.PI;
  h.u.mesh.position.set(h.x, 0, h.z);
  scene.add(h.u.mesh);
  h.hp = Math.round(h.maxHp * 0.6);
  h.bar.material.color.setHex(SIDES[side].color);
}
makeHold('shu', 'castle', -64, 34);
makeHold('wei', 'castle', -64, -34);
makeHold('wu', 'castle', 64, 0);
makeHold('shu', 'fort', -30, 17);
makeHold('wei', 'fort', -30, -17);
makeHold('wu', 'fort', 30, 0);
// 飾り
function placeDeco(key, x, z, scale, rotY, y) {
  const u = makeUnit(byKey[key]);
  updateUnit(u, 0, null);
  u.mesh.scale.setScalar(scale);
  u.mesh.rotation.y = rotY || 0;
  u.mesh.position.set(x, y || 0, z);
  scene.add(u.mesh);
}
placeDeco('bridge', 0, 0, 0.62, Math.PI / 2, 1.05);
const deck = new THREE.Mesh(new THREE.BoxGeometry(25, 0.9, 10.5), new THREE.MeshLambertMaterial({ color: 0x8a6844 }));
deck.position.set(0, 0.6, 0);
scene.add(deck);
placeDeco('flag', 12, -8, 0.4, 0.6);
const DECO = [[-46, 52], [-14, -46], [18, 40], [44, -38], [-48, -6], [22, -18], [52, 30], [-20, 58], [8, -58], [40, 52]];
DECO.forEach(([x, z], i) => {
  if (i % 3 === 0) placeDeco('house', x, z, 0.34, (i * 1.3) % 3);
  else if (i % 3 === 1) placeDeco('tree', x, z, 0.3, i);
  else placeDeco('rock', x, z, 0.3, i * 2.1);
});

// ---------- ユニット ----------
const units = [];
let points = 40;
let kills = 0;
const sideTarget = { shu: null, wei: null, wu: null };
function nearestEnemyHold(side, from) {
  let best = null, bd = 1e9;
  for (const h of holds) {
    if (h.side === side) continue;
    const d = (h.x - from.x) ** 2 + (h.z - from.z) ** 2;
    if (d < bd) { bd = d; best = h; }
  }
  return best;
}
for (const sd of ['shu', 'wei', 'wu']) sideTarget[sd] = nearestEnemyHold(sd, { x: sd === 'wu' ? 64 : -64, z: 0 });
function pickSoldier() {
  let r = Math.random(), acc = 0;
  for (const t of SOLDIER_TYPES) { acc += t.w; if (r <= acc) return t; }
  return SOLDIER_TYPES[0];
}
function spawnUnit(side, hold) {
  const t = pickSoldier();
  const entry = byKey[t.kind + '_' + side] || byKey.hohei_shu;
  const u = makeUnit(entry);
  u.mesh.scale.setScalar(0.15);
  scene.add(u.mesh);
  const a = Math.random() * Math.PI * 2;
  const un = { side, kind: t.kind, general: null, u, entry,
    x: hold.x + Math.cos(a) * 7, z: hold.z + Math.sin(a) * 5,
    hp: t.hp, maxHp: t.hp, dmg: t.dmg, range: t.range, speed: t.speed * (0.9 + Math.random() * 0.2),
    atkCd: 0, tx: 0, tz: 0, seed: Math.random() * 10 };
  units.push(un);
  return un;
}
const generalState = {};
function deployGeneral(key) {
  const gs = generalState[key] || (generalState[key] = { alive: false, cd: 0 });
  if (gs.alive || gs.cd > 0 || points < GENERAL_COST) return;
  points -= GENERAL_COST;
  const home = holds.find(h => h.side === 'shu' && h.kind === 'castle') || holds.find(h => h.side === 'shu');
  if (!home) return;
  const entry = byKey[key];
  const u = makeUnit(entry);
  u.mesh.scale.setScalar(0.17);
  scene.add(u.mesh);
  const un = { side: 'shu', kind: 'general', general: key, u, entry,
    x: home.x + 8, z: home.z + (Math.random() * 6 - 3),
    hp: 170, maxHp: 170, dmg: 9, range: 3.0, speed: 7.2,
    atkCd: 0, tx: 0, tz: 0, seed: Math.random() * 10, transformed: false,
    bar: barMesh(0xffd97a, 5) };
  gs.alive = true;
  gs.unit = un;
  units.push(un);
  setMsg(entry.name + ' が出撃しました');
}
function setMsg(t) { document.getElementById('msg').textContent = t; }

// ---------- 入力（進軍先の指定） ----------
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function onTap(cx, cy) {
  mouse.x = (cx / innerWidth) * 2 - 1;
  mouse.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const pts = ray.intersectObjects(holds.map(h => h.u.mesh));
  let target = null;
  if (pts.length) {
    target = holds.find(h => h.u.mesh === pts[0].object);
  } else {
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hit = new THREE.Vector3();
    if (ray.ray.intersectPlane(plane, hit)) {
      let bd = 1e9;
      for (const h of holds) { const d = (h.x - hit.x) ** 2 + (h.z - hit.z) ** 2; if (d < bd) { bd = d; target = h; } }
    }
  }
  if (target && target.side !== 'shu') {
    sideTarget.shu = target;
    setMsg('進軍先を ' + SIDES[target.side].name + 'の' + (target.kind === 'castle' ? '城' : '砦') + ' に変えました');
  } else if (target) {
    setMsg('自軍の拠点です。敵の城や砦を選んでください');
  }
}
renderer.domElement.addEventListener('pointerdown', e => onTap(e.clientX, e.clientY));

// ---------- 武将ボタン ----------
const gwrap = document.getElementById('generals');
const gbtns = {};
for (const key of GENERAL_KEYS) {
  const b = document.createElement('button');
  b.className = 'gbtn';
  b.innerHTML = byKey[key].name + ' <small>兵力' + GENERAL_COST + '</small>';
  b.addEventListener('click', () => deployGeneral(key));
  gwrap.appendChild(b);
  gbtns[key] = b;
}
document.getElementById('btn-retry').addEventListener('click', () => location.reload());

// ---------- AI ----------
let aiT = 0;
function aiThink(dt) {
  aiT -= dt;
  if (aiT > 0) return;
  aiT = 6;
  for (const sd of ['wei', 'wu']) {
    const mine = holds.filter(h => h.side === sd);
    if (!mine.length) continue;
    let best = null, bs = 1e9;
    for (const h of holds) {
      if (h.side === sd) continue;
      const score = h.hp + (h.side === 'shu' ? -40 : 0) + Math.random() * 60;
      if (score < bs) { bs = score; best = h; }
    }
    if (best) sideTarget[sd] = best;
  }
}

// ---------- 戦闘と移動 ----------
let ended = false;
function endGame(win, text) {
  if (ended) return;
  ended = true;
  document.getElementById('end-title').textContent = win ? '勝利' : '敗北';
  document.getElementById('end-text').textContent = text;
  document.getElementById('ov-end').classList.remove('hidden');
}
function damageHold(h, dmg, bySide) {
  h.hp -= dmg;
  if (h.hp <= 0) {
    const old = h.side;
    setHoldSide(h, bySide);
    setMsg(SIDES[old].name + 'の' + (h.kind === 'castle' ? '城' : '砦') + ' が ' + SIDES[bySide].name + ' の手に落ちました');
    for (const sd of ['shu', 'wei', 'wu']) if (sideTarget[sd] === h) sideTarget[sd] = nearestEnemyHold(sd, h);
    const castles = { shu: 0, wei: 0, wu: 0 };
    for (const hh of holds) if (hh.kind === 'castle') castles[hh.side]++;
    if (castles.shu === 3) endGame(true, '三国の城をすべて落としました。');
    if (castles.shu === 0) endGame(false, '自城をすべて落とされました。');
  }
}
const _v = new THREE.Vector3();
function stepUnit(un, dt) {
  un.atkCd = Math.max(0, un.atkCd - dt);
  // 敵を探す
  let foe = null, fd = 1e9;
  for (const o of units) {
    if (o.side === un.side || o.hp <= 0) continue;
    const d = (o.x - un.x) ** 2 + (o.z - un.z) ** 2;
    if (d < fd) { fd = d; foe = o; }
  }
  const target = sideTarget[un.side] && sideTarget[un.side].side !== un.side ? sideTarget[un.side] : nearestEnemyHold(un.side, un);
  const fRange = un.range + 1.4;
  if (foe && fd < fRange * fRange) {
    faceTo(un, foe.x - un.x, foe.z - un.z);
    if (un.atkCd <= 0) {
      un.atkCd = 0.8;
      foe.hp -= un.dmg * (0.85 + Math.random() * 0.3);
      if (foe.hp <= 0 && foe.side !== 'shu') { if (un.side === 'shu') { points += 3; kills++; } }
      if (foe.hp <= 0 && foe.general) {
        const gs = generalState[foe.general];
        if (gs) { gs.alive = false; gs.cd = 20; gs.unit = null; }
        setMsg(byKey[foe.general].name + ' が倒れました');
      }
    }
    return 'fight';
  }
  if (!target) return 'idle';
  const gx = target.x + Math.cos(un.seed * 7.3) * (target.kind === 'castle' ? 13 : 9);
  const gz = target.z + Math.sin(un.seed * 5.1) * (target.kind === 'castle' ? 10 : 7);
  const dx = gx - un.x, dz = gz - un.z;
  const distT = Math.hypot(dx, dz);
  const hRange = un.range + (target.kind === 'castle' ? 11 : 7.5);
  if (distT < hRange) {
    faceTo(un, target.x - un.x, target.z - un.z);
    if (un.atkCd <= 0) { un.atkCd = 0.8; damageHold(target, un.dmg * 0.8 * (0.85 + Math.random() * 0.3), un.side); }
    return 'siege';
  }
  // 川は橋でしか渡れない: 反対岸が目的地なら橋経由に回す
  let wx = gx, wz = gz;
  const RIVER_HALF = 5.5, BRIDGE_HALF = 4.5;
  if ((un.x < -RIVER_HALF && gx > RIVER_HALF) || (un.x > RIVER_HALF && gx < -RIVER_HALF)) {
    if (Math.abs(un.z) > BRIDGE_HALF) { wx = un.x < 0 ? -RIVER_HALF - 1.5 : RIVER_HALF + 1.5; wz = 0; }
    else { wx = 0; wz = 0; }
  }
  const wdx = wx - un.x, wdz = wz - un.z;
  const distW = Math.hypot(wdx, wdz);
  // 移動（分離つき）
  let mx = wdx / (distW || 1), mz = wdz / (distW || 1);
  for (const o of units) {
    if (o === un || o.hp <= 0) continue;
    const ox = un.x - o.x, oz = un.z - o.z;
    const od = ox * ox + oz * oz;
    if (od > 0.01 && od < 2.6) { mx += ox / od * 1.6; mz += oz / od * 1.6; }
  }
  const ml = Math.hypot(mx, mz) || 1;
  un.x += (mx / ml) * un.speed * dt;
  un.z += (mz / ml) * un.speed * dt;
  un.x = Math.max(-88, Math.min(88, un.x));
  un.z = Math.max(-62, Math.min(62, un.z));
  faceTo(un, mx, mz);
  return 'move';
}
function faceTo(un, dx, dz) {
  if (Math.abs(dx) + Math.abs(dz) < 0.001) return;
  un.u.mesh.rotation.y = Math.atan2(-dx, -dz);
}

// ---------- メインループ ----------
let last = performance.now();
let ptsT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (ended) { renderer.render(scene, camera); return; }
  ptsT += dt;
  if (ptsT > 1) { ptsT = 0; points += 1.2; }
  skyUpdate(dt);
  aiThink(dt);
  // 湧き
  for (const h of holds) {
    if (!isNight) h.spawnT -= dt;
    const interval = h.kind === 'castle' ? 2.4 : 3.8;
    if (h.spawnT <= 0) {
      h.spawnT = interval;
      if (units.filter(u => u.side === h.side && u.hp > 0).length < UNIT_CAP) spawnUnit(h.side, h);
    }
    const f = Math.max(0, h.hp / h.maxHp);
    h.bar.scale.x = f;
    h.bar.position.x = h.x - (1 - f) * (h.kind === 'castle' ? 7.5 : 4.5);
    updateUnit(h.u, 0, null);
    crumbleHold(h);
  }
  // ユニット
  for (let i = units.length - 1; i >= 0; i--) {
    const un = units[i];
    if (un.hp <= 0) {
      scene.remove(un.u.mesh);
      if (un.bar) scene.remove(un.bar);
      units.splice(i, 1);
      continue;
    }
    const st = stepUnit(un, dt);
    if (un.general && !un.transformed && un.hp < un.maxHp * 0.55) {
      un.transformed = true;
      un.u.targetForm = 1;
      un.dmg *= 1.5;
      un.speed *= 0.82;
      setMsg(byKey[un.general].name + ' がロボットに変形しました');
    }
    const moving = st === 'move';
    updateUnit(un.u, dt, un.general && un.transformed && moving ? 'run' : null);
    const lift = (Math.abs(un.x) < 8.5 && Math.abs(un.z) < 6) ? 1.05 : 0;
    un.u.mesh.position.set(un.x, (un.u.bobY || 0) + lift, un.z);
    if (un.bar) {
      const f = Math.max(0, un.hp / un.maxHp);
      un.bar.scale.x = f;
      un.bar.position.set(un.x - (1 - f) * 2.5, 7.6, un.z);
    }
  }
  // HUD
  document.getElementById('pts').textContent = Math.floor(points);
  const c = { shu: 0, wei: 0, wu: 0 };
  for (const h of holds) if (h.kind === 'castle') c[h.side]++;
  document.getElementById('holds').innerHTML =
    '<span class="shu">蜀 城' + c.shu + '</span> <span class="wei">魏 城' + c.wei + '</span> <span class="wu">呉 城' + c.wu + '</span>';
  for (const key of GENERAL_KEYS) {
    const gs = generalState[key];
    const b = gbtns[key];
    if (gs && gs.cd > 0) gs.cd -= dt;
    const alive = gs && gs.alive;
    const cd = gs ? Math.max(0, gs.cd) : 0;
    b.disabled = alive || cd > 0 || points < GENERAL_COST;
    b.innerHTML = byKey[key].name + (alive ? ' <small>出撃中</small>' : cd > 0 ? ' <small>再出撃まで ' + Math.ceil(cd) + '秒</small>' : ' <small>兵力' + GENERAL_COST + '</small>');
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
