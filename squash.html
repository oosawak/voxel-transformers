<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縦つぶし実験 ― 赤い子竜で表示だけ縮める | 変形ボクセルギャラリー</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1324; color: #e2e8f0; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  header { max-width: 1080px; margin: 0 auto; padding: 20px 16px 4px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.lead { color: #94a3b8; font-size: 14px; line-height: 1.7; margin: 0 0 4px; }
  a { color: #7dd3fc; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 8px 16px 28px; }
  #viewer-canvas { width: 100%; height: 62vh; display: block; background: #0b1324; border: 1px solid #1e293b; border-radius: 10px; touch-action: none; }
  .panel { margin-top: 12px; background: #111c33; border: 1px solid #1e293b; border-radius: 10px; padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  label { font-size: 14px; }
  input[type="range"] { flex: 1; min-width: 160px; }
  .val { font-size: 18px; font-weight: bold; min-width: 64px; text-align: right; }
  .presets { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  button.on { background: #2563eb; border-color: #2563eb; }
  .note { color: #94a3b8; font-size: 13px; line-height: 1.7; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>縦つぶし実験 ― 赤い子竜</h1>
  <p class="lead">データは正立方体のボクセルのまま一切変えず、<strong>表示のときだけ箱の縦を縮める</strong>実験です。縦を薄くしていくと、薄い板を積んだスプライトスタックの見た目に近づきます。ドラッグで回せます。</p>
  <p class="lead"><a href="index.html">← ギャラリーへ戻る</a></p>
</header>
<div class="wrap">
  <canvas id="viewer-canvas"></canvas>
  <div class="panel">
    <div class="row">
      <label for="squash">縦の長さ</label>
      <input type="range" id="squash" min="0.1" max="1" step="0.01" value="1">
      <span class="val" id="squash-val">1.00</span>
    </div>
    <div class="presets">
      <button data-s="1">1.00 そのまま</button>
      <button data-s="0.5">0.50</button>
      <button data-s="0.3">0.30</button>
      <button data-s="0.2">0.20</button>
      <button data-s="0.12">0.12 板みたいに薄く</button>
    </div>
    <p class="note" id="info">読み込み中…</p>
    <p class="note">仕組み: ボクセルの位置と箱の高さの両方に、縦の倍率を掛けているだけです。元のデータ（表面18,464個、高さ98層）はそのままなので、倍率を戻せば元の姿に戻ります。作る側で大きく作っておいて、見せる機械に合わせて表示で落とす、という使い方の確認用です。</p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./models-extra.js"></script>
<script>
(function () {
  const canvas = document.getElementById('viewer-canvas');
  const slider = document.getElementById('squash');
  const valEl = document.getElementById('squash-val');
  const infoEl = document.getElementById('info');
  if (!window.THREE || !window.EXTRA_MODELS) { infoEl.textContent = 'ビューアを読み込めませんでした'; return; }
  const m = window.EXTRA_MODELS.find(e => e.key === 'babydragon');
  if (!m) { infoEl.textContent = '子竜のデータが見つかりませんでした'; return; }

  function createGrid(X, Y, Z) { return { X, Y, Z, data: new Uint8Array(X * Y * Z) }; }
  function setVoxel(g, x, y, z, c) {
    if (x < 0 || y < 0 || z < 0 || x >= g.X || y >= g.Y || z >= g.Z) return;
    g.data[x + g.X * (y + g.Y * z)] = c;
  }
  function getVoxel(g, x, y, z) {
    if (x < 0 || y < 0 || z < 0 || x >= g.X || y >= g.Y || z >= g.Z) return 0;
    return g.data[x + g.X * (y + g.Y * z)];
  }
  function gridFromQuads(dims, dataB64) {
    const g = createGrid(dims[0], dims[1], dims[2]);
    const bin = atob(dataB64);
    for (let i = 0; i + 3 < bin.length; i += 4) {
      setVoxel(g, bin.charCodeAt(i), bin.charCodeAt(i + 1), bin.charCodeAt(i + 2), bin.charCodeAt(i + 3));
    }
    return g;
  }
  function extractSurfaceVoxels(grid, palette) {
    const list = [];
    for (let x = 0; x < grid.X; x++) for (let y = 0; y < grid.Y; y++) for (let z = 0; z < grid.Z; z++) {
      const c = getVoxel(grid, x, y, z);
      if (!c) continue;
      if (getVoxel(grid, x - 1, y, z) && getVoxel(grid, x + 1, y, z) &&
          getVoxel(grid, x, y - 1, z) && getVoxel(grid, x, y + 1, z) &&
          getVoxel(grid, x, y, z - 1) && getVoxel(grid, x, y, z + 1)) continue;
      list.push({ x: x - grid.X / 2 + 0.5, y: z - grid.Z / 2 + 0.5, z: -(y - grid.Y / 2 + 0.5), color: palette[c] });
    }
    return list;
  }

  const f = m.forms[0];
  const surface = extractSurfaceVoxels(gridFromQuads(f.dims, f.data), m.palette);
  const H = f.dims[2];

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1324);
  const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 3000);
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const dir = new THREE.DirectionalLight(0xfff5e6, 0.95); dir.position.set(60, 120, 70); scene.add(dir);
  const rim = new THREE.DirectionalLight(0x4da6ff, 0.45); rim.position.set(-70, 30, -80); scene.add(rim);
  const grid = new THREE.GridHelper(220, 44, 0x3b82f6, 0x1e293b); scene.add(grid);

  const mesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.96, 0.96, 0.96),
    new THREE.MeshLambertMaterial({ color: 0xffffff }),
    surface.length
  );
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(mesh);
  const dummy = new THREE.Object3D();
  const tmpColor = new THREE.Color();
  for (let i = 0; i < surface.length; i++) mesh.setColorAt(i, tmpColor.setHex(surface[i].color || 0xcccccc));
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

  let squash = parseFloat(new URLSearchParams(location.search).get('s')) || 1;
  squash = Math.min(1, Math.max(0.1, squash));
  slider.value = squash;
  let yaw = 0.65, pitch = 0.30, dragging = false, px = 0, py = 0, auto = true;

  function applySquash() {
    for (let i = 0; i < surface.length; i++) {
      const v = surface[i];
      dummy.position.set(v.x, (v.y + H / 2) * squash, v.z);
      dummy.scale.set(1, squash, 1);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    valEl.textContent = squash.toFixed(2);
    infoEl.textContent = '表面 ' + surface.length.toLocaleString() + ' 個 ／ 高さ ' + H + ' 層 → 表示の高さ 約' + Math.round(H * squash) + ' ／ 縦の倍率 ' + squash.toFixed(2);
    document.querySelectorAll('.presets button').forEach(b =>
      b.classList.toggle('on', Math.abs(parseFloat(b.dataset.s) - squash) < 0.005));
  }
  slider.addEventListener('input', () => { squash = parseFloat(slider.value); applySquash(); });
  document.querySelectorAll('.presets button').forEach(b =>
    b.addEventListener('click', () => { squash = parseFloat(b.dataset.s); slider.value = squash; applySquash(); }));

  canvas.addEventListener('pointerdown', e => { dragging = true; auto = false; px = e.clientX; py = e.clientY; });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw += (e.clientX - px) * 0.008; pitch += (e.clientY - py) * 0.006;
    pitch = Math.max(-0.1, Math.min(1.2, pitch)); px = e.clientX; py = e.clientY;
  });

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
  }
  const DIST = 190;
  function tick() {
    requestAnimationFrame(tick);
    resize();
    if (auto) yaw += 0.004;
    const ty = 26 * squash + 8;
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * DIST, Math.sin(pitch) * DIST + ty, Math.cos(yaw) * Math.cos(pitch) * DIST);
    camera.lookAt(0, ty, 0);
    renderer.render(scene, camera);
  }
  applySquash();
  tick();
})();
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "cdf4ee53507948e4a412f503875833cd"}'></script>
</body>
</html>
